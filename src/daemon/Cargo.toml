[package]
name = "mirage-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
cfg-if = "1"
lancedb = "0.37"
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
arrow-buffer = "58"
futures = { version = "0.3", features = ["std"] }

[dev-dependencies]
tempfile = "3"
