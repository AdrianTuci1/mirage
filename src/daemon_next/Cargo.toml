[package]
name = "mirage-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
cfg-if = "1"
lancedb = "0.37"
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
arrow-buffer = "58"
futures = { version = "0.3", features = ["std"] }
ort = { version = "2.0.0-rc.13", default-features = false, optional = true }
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
zip = "2"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
async-trait = "0.1"
dirs = "5"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "ico",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-config = "1"
pavao = { version = "0.2", optional = true }
urlencoding = "2"
notify-debouncer-full = "0.5"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["onnx"]
# The ONNX Runtime is a downloaded module (`onnx_runtime`) the daemon loads at
# runtime via `ORT_DYLIB_PATH`, so the build no longer downloads or statically
# links it (`load-dynamic` skips both in `ort-sys`).
onnx = ["dep:ort", "ort/std", "ort/ndarray", "ort/tracing", "ort/load-dynamic", "ort/tls-rustls", "ort/api-27"]
smb = ["dep:pavao"]

[dev-dependencies]
tempfile = "3"

# Dev profile: DWARF for all 733 crates made target/ reach 23 GiB and the debug
# binary 689 MB. Line tables keep backtraces usable; dependencies get no debug
# info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
