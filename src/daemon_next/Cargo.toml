[package]
name = "mirage-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
cfg-if = "1"
lancedb = "0.37"
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
arrow-buffer = "58"
futures = { version = "0.3", features = ["std"] }
ort = "2.0.0-rc.13"
duckdb = { version = "1", features = ["bundled"] }
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
zip = "2"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
async-trait = "0.1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
